<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect x="0" y="0" width="1200" height="560" fill="#F8FAFC"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="16" y="38" font-size="28" font-weight="800" fill="#0F172A">Did it learn?</text>
    <text x="228" y="36" font-size="16" font-weight="600" fill="#475569">Pipeline testing whether an AI build loop really learned a task, or just learned the test</text>

    <path d="M 118 104 L 118 78 L 960 78 L 960 96" fill="none" stroke="#334155" stroke-width="2"/>
    <polygon points="960,103 955,94 965,94" fill="#334155"/>
    <path d="M 521 104 L 521 78" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M 748 78 L 748 96" fill="none" stroke="#334155" stroke-width="2"/>
    <polygon points="748,103 743,94 753,94" fill="#334155"/>
    <text x="539" y="69" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Loop's controller (code) and full transcripts flow directly to Stage 4 and Stage 5</text>

    <rect x="16" y="104" width="204" height="292" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="16" y="104" width="204" height="28" rx="8" fill="#4F46E5"/>
    <text x="118" y="123" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MANAGED AGENTS</text>
    <text x="28" y="154" font-size="16" font-weight="800" fill="#1E1B4B">1. Build Loop</text>
    <text x="28" y="176" font-size="14" font-weight="700" fill="#0F172A">Google's loop:</text>
    <text x="28" y="194" font-size="13" fill="#1E293B">render, watch, critique, fix</text>
    <text x="28" y="218" font-size="14" font-weight="700" fill="#0F172A">Sandbox runs on:</text>
    <text x="28" y="237" font-size="14" font-weight="700" fill="#3730A3">16 practice flights</text>
    <text x="28" y="255" font-size="13" fill="#1E293B">of a quadcopter course</text>
    <rect x="28" y="270" width="180" height="112" rx="6" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.5"/>
    <text x="38" y="292" font-size="14" font-weight="700" fill="#1E1B4B">Produces:</text>
    <text x="38" y="315" font-size="14" font-weight="600" fill="#0F172A">&#8226; Controller (code)</text>
    <text x="38" y="338" font-size="14" font-weight="600" fill="#0F172A">&#8226; Record</text>
    <text x="50" y="358" font-size="13" fill="#475569">(the full transcript)</text>

    <line x1="220" y1="250" x2="230" y2="250" stroke="#334155" stroke-width="2.5"/>
    <polygon points="237,250 228,245 228,255" fill="#334155"/>

    <rect x="238" y="104" width="166" height="292" rx="10" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
    <rect x="238" y="104" width="166" height="28" rx="8" fill="#0F766E"/>
    <text x="321" y="123" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ARGON</text>
    <text x="250" y="154" font-size="16" font-weight="800" fill="#134E4A">2. Compress</text>
    <text x="250" y="182" font-size="14" fill="#1E293B">Argon compresses</text>
    <text x="250" y="202" font-size="14" fill="#1E293B">the record into a</text>
    <text x="250" y="222" font-size="14" font-weight="700" fill="#0F766E">32-token recipe</text>
    <rect x="252" y="246" width="138" height="86" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <text x="321" y="282" font-size="16" font-weight="800" fill="#0F766E" text-anchor="middle">32-token</text>
    <text x="321" y="306" font-size="16" font-weight="800" fill="#0F766E" text-anchor="middle">recipe</text>
    <text x="321" y="362" font-size="13" font-weight="600" fill="#115E59" text-anchor="middle">Distilled strategy</text>

    <line x1="404" y1="250" x2="414" y2="250" stroke="#334155" stroke-width="2.5"/>
    <polygon points="421,250 412,245 412,255" fill="#334155"/>

    <rect x="422" y="104" width="198" height="292" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="422" y="104" width="198" height="28" rx="8" fill="#4F46E5"/>
    <text x="521" y="123" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MANAGED AGENTS</text>
    <text x="434" y="154" font-size="16" font-weight="800" fill="#1E1B4B">3. Rebuild</text>
    <text x="434" y="180" font-size="14" fill="#1E293B">Fresh sandboxes</text>
    <text x="434" y="200" font-size="14" fill="#1E293B">rebuild a controller</text>
    <text x="434" y="220" font-size="14" fill="#1E293B">from the</text>
    <text x="434" y="240" font-size="14" font-weight="700" fill="#1E1B4B">recipe alone</text>
    <rect x="434" y="264" width="174" height="118" rx="6" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.5"/>
    <text x="521" y="292" font-size="15" font-weight="800" fill="#3730A3" text-anchor="middle">8 to 16 rebuilds</text>
    <text x="521" y="312" font-size="14" font-weight="700" fill="#3730A3" text-anchor="middle">per recipe</text>
    <text x="521" y="342" font-size="13" fill="#475569" text-anchor="middle">Independent</text>
    <text x="521" y="360" font-size="13" fill="#475569" text-anchor="middle">rebuilt controllers</text>

    <line x1="620" y1="250" x2="630" y2="250" stroke="#334155" stroke-width="2.5"/>
    <polygon points="637,250 628,245 628,255" fill="#334155"/>

    <rect x="638" y="104" width="220" height="292" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="638" y="104" width="220" height="28" rx="8" fill="#B45309"/>
    <text x="748" y="123" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">OUR CODE JUDGE</text>
    <text x="650" y="154" font-size="16" font-weight="800" fill="#78350F">4. Judge Flights</text>
    <text x="650" y="180" font-size="14" fill="#1E293B">Our code judge flies</text>
    <text x="650" y="200" font-size="14" fill="#1E293B">everything:</text>
    <text x="650" y="222" font-size="14" font-weight="600" fill="#0F172A">&#8226; Loop's controller</text>
    <text x="650" y="242" font-size="14" font-weight="600" fill="#0F172A">&#8226; Every rebuild</text>
    <rect x="648" y="264" width="200" height="118" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="748" y="290" font-size="14" font-weight="600" fill="#78350F" text-anchor="middle">Tested on</text>
    <text x="748" y="314" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">64 secret held-out flights</text>
    <text x="748" y="342" font-size="13" fill="#475569" text-anchor="middle">Unseen courses test</text>
    <text x="748" y="360" font-size="13" fill="#475569" text-anchor="middle">true generalization</text>

    <line x1="858" y1="291" x2="871" y2="291" stroke="#334155" stroke-width="2.5"/>
    <polygon points="879,291 870,286 870,296" fill="#334155"/>

    <rect x="880" y="104" width="304" height="292" rx="10" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
    <rect x="880" y="104" width="304" height="28" rx="8" fill="#0F766E"/>
    <text x="1032" y="123" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ARGON CHECKS</text>

    <rect x="890" y="138" width="284" height="116" rx="8" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="900" y="156" font-size="15" font-weight="800" fill="#134E4A">5. Check Code (Two Ways)</text>
    <text x="900" y="175" font-size="13" font-weight="700" fill="#0F172A">&#8226; Long-context read (one request):</text>
    <text x="910" y="192" font-size="13" font-weight="700" fill="#0F766E">944,000 tokens of transcripts</text>
    <text x="900" y="211" font-size="13" font-weight="700" fill="#0F172A">&#8226; Long-output audit (one answer):</text>
    <text x="910" y="228" font-size="13" fill="#334155">every line of every controller</text>
    <text x="910" y="244" font-size="13" fill="#334155">annotated</text>

    <rect x="890" y="260" width="284" height="62" rx="8" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="900" y="279" font-size="15" font-weight="800" fill="#134E4A">6. Watch Flight Video</text>
    <text x="900" y="297" font-size="13" fill="#1E293B">Argon watches flight video and</text>
    <text x="900" y="314" font-size="13" font-weight="700" fill="#0F766E">calls each flight pass or fail</text>

    <rect x="890" y="328" width="284" height="60" rx="8" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="900" y="347" font-size="15" font-weight="800" fill="#134E4A">7. Check Live Flight</text>
    <text x="900" y="365" font-size="13" fill="#1E293B">At the table, Argon checks</text>
    <text x="900" y="381" font-size="13" font-weight="700" fill="#0F766E">a live flight</text>
    <rect x="1096" y="352" width="66" height="26" rx="13" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
    <text x="1129" y="370" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">LIVE</text>

    <path d="M 690 396 L 690 408 L 320 408 L 320 414" fill="none" stroke="#334155" stroke-width="2"/>
    <polygon points="320,421 315,412 325,412" fill="#334155"/>
    <line x1="790" y1="396" x2="790" y2="414" stroke="#334155" stroke-width="2"/>
    <polygon points="790,421 785,412 795,412" fill="#334155"/>
    <line x1="1010" y1="396" x2="1010" y2="414" stroke="#334155" stroke-width="2"/>
    <polygon points="1010,421 1005,412 1015,412" fill="#334155"/>

    <rect x="16" y="422" width="430" height="124" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <rect x="16" y="422" width="10" height="124" rx="4" fill="#DC2626"/>
    <text x="36" y="444" font-size="13" font-weight="800" fill="#991B1B">RESULT 1: PRACTICE VS HELD-OUT FLIGHTS</text>
    <rect x="36" y="454" width="174" height="52" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="48" y="488" font-size="24" font-weight="800" fill="#15803D">16/16</text>
    <text x="130" y="485" font-size="14" font-weight="700" fill="#1E293B">practice</text>
    <line x1="216" y1="480" x2="235" y2="480" stroke="#991B1B" stroke-width="2.5"/>
    <polygon points="243,480 234,475 234,485" fill="#991B1B"/>
    <rect x="248" y="454" width="182" height="52" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <text x="260" y="488" font-size="24" font-weight="800" fill="#DC2626">0/64</text>
    <text x="330" y="485" font-size="14" font-weight="700" fill="#991B1B">held-out</text>
    <text x="36" y="531" font-size="14" font-weight="700" fill="#7F1D1D">The cheater: 16/16 practice, then 0/64 held-out.</text>

    <rect x="464" y="422" width="720" height="124" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <rect x="464" y="422" width="10" height="124" rx="4" fill="#2563EB"/>
    <text x="484" y="444" font-size="13" font-weight="800" fill="#1E40AF">RESULT 2: SEED HUNT IN REBUILDS FROM THE 32-TOKEN RECIPE</text>
    <rect x="484" y="454" width="324" height="52" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="498" y="488" font-size="24" font-weight="800" fill="#DC2626">8 of 8</text>
    <text x="588" y="477" font-size="14" font-weight="700" fill="#1E293B">rebuilds got seed hunt</text>
    <text x="588" y="495" font-size="13" fill="#475569">(cheater's recipe)</text>
    <rect x="828" y="454" width="336" height="52" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="842" y="488" font-size="24" font-weight="800" fill="#059669">0 of 8</text>
    <text x="932" y="477" font-size="14" font-weight="700" fill="#1E293B">rebuilds got seed hunt</text>
    <text x="932" y="495" font-size="13" fill="#475569">(honest recipe)</text>
    <text x="484" y="531" font-size="13" font-weight="700" fill="#1E3A8A">The cheater's recipe passed the seed hunt to 8 of 8 rebuilds; the honest recipe, 0 of 8.</text>
  </g>
</svg>