<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect x="0" y="0" width="1200" height="560" fill="#F8FAFC"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="18" y="38" font-size="30" font-weight="800" fill="#0F172A">Did it learn?</text>
    <text x="218" y="36" font-size="16" font-weight="600" fill="#475569">Pipeline testing whether an AI build loop really learned a task, or just learned the test</text>

    <path d="M 121 104 L 121 80 L 856 80 L 856 176 L 878 176" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 522 104 L 522 80" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M 747 80 L 747 102" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="460" y="72" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Loop's controller (code) and full transcripts flow to Stage 4 and Stage 5</text>

    <rect x="18" y="104" width="206" height="288" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="18" y="104" width="206" height="28" rx="8" fill="#4F46E5"/>
    <text x="121" y="123" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MANAGED AGENTS SANDBOX</text>
    <text x="28" y="154" font-size="16" font-weight="800" fill="#1E1B4B">1. BUILD</text>
    <text x="28" y="177" font-size="14" font-weight="700" fill="#0F172A">Google's loop:</text>
    <text x="28" y="196" font-size="14" fill="#1E293B">render, watch, critique, fix</text>
    <text x="28" y="222" font-size="14" font-weight="700" fill="#0F172A">Runs on:</text>
    <text x="28" y="241" font-size="14" font-weight="700" fill="#3730A3">16 practice flights</text>
    <text x="28" y="260" font-size="14" fill="#1E293B">of a quadcopter course</text>
    <rect x="28" y="276" width="186" height="102" rx="6" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.5"/>
    <text x="38" y="297" font-size="14" font-weight="700" fill="#1E1B4B">Produces:</text>
    <text x="38" y="320" font-size="14" font-weight="600" fill="#0F172A">&#8226; Controller (code)</text>
    <text x="38" y="343" font-size="14" font-weight="600" fill="#0F172A">&#8226; Record</text>
    <text x="50" y="363" font-size="13" fill="#475569">(the full transcript)</text>

    <line x1="224" y1="248" x2="242" y2="248" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="244" y="104" width="156" height="288" rx="10" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
    <rect x="244" y="104" width="156" height="28" rx="8" fill="#0F766E"/>
    <text x="322" y="123" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ARGON</text>
    <text x="256" y="154" font-size="16" font-weight="800" fill="#134E4A">2. COMPRESS</text>
    <text x="256" y="184" font-size="14" fill="#1E293B">Argon compresses</text>
    <text x="256" y="204" font-size="14" fill="#1E293B">the record into a</text>
    <text x="256" y="224" font-size="14" font-weight="700" fill="#0F766E">32-token recipe</text>
    <rect x="256" y="246" width="132" height="82" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <text x="322" y="280" font-size="16" font-weight="800" fill="#0F766E" text-anchor="middle">32-token</text>
    <text x="322" y="304" font-size="16" font-weight="800" fill="#0F766E" text-anchor="middle">recipe</text>
    <text x="322" y="358" font-size="13" font-weight="600" fill="#115E59" text-anchor="middle">Distilled strategy only</text>

    <line x1="400" y1="248" x2="418" y2="248" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="420" y="104" width="204" height="288" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="420" y="104" width="204" height="28" rx="8" fill="#4F46E5"/>
    <text x="522" y="123" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MANAGED AGENTS SANDBOXES</text>
    <text x="432" y="154" font-size="16" font-weight="800" fill="#1E1B4B">3. REBUILD</text>
    <text x="432" y="182" font-size="14" fill="#1E293B">Fresh Managed Agents</text>
    <text x="432" y="202" font-size="14" fill="#1E293B">sandboxes rebuild a</text>
    <text x="432" y="222" font-size="14" fill="#1E293B">controller from the</text>
    <text x="432" y="242" font-size="14" font-weight="700" fill="#1E1B4B">recipe alone</text>
    <rect x="430" y="264" width="184" height="112" rx="6" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.5"/>
    <text x="522" y="292" font-size="15" font-weight="800" fill="#3730A3" text-anchor="middle">8 to 16 rebuilds</text>
    <text x="522" y="312" font-size="14" font-weight="700" fill="#3730A3" text-anchor="middle">per recipe</text>
    <text x="522" y="340" font-size="13" fill="#475569" text-anchor="middle">Produces independent</text>
    <text x="522" y="358" font-size="13" fill="#475569" text-anchor="middle">rebuilt controllers</text>

    <line x1="624" y1="248" x2="642" y2="248" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="644" y="104" width="206" height="288" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="644" y="104" width="206" height="28" rx="8" fill="#B45309"/>
    <text x="747" y="123" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">OUR CODE JUDGE</text>
    <text x="656" y="154" font-size="16" font-weight="800" fill="#78350F">4. JUDGE FLIGHTS</text>
    <text x="656" y="182" font-size="14" fill="#1E293B">Our code judge flies</text>
    <text x="656" y="202" font-size="14" fill="#1E293B">everything:</text>
    <text x="656" y="224" font-size="14" font-weight="600" fill="#0F172A">&#8226; The loop's controller</text>
    <text x="656" y="244" font-size="14" font-weight="600" fill="#0F172A">&#8226; Every rebuild</text>
    <rect x="652" y="264" width="190" height="112" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="747" y="290" font-size="14" font-weight="600" fill="#78350F" text-anchor="middle">Tested on</text>
    <text x="747" y="314" font-size="14" font-weight="800" fill="#B45309" text-anchor="middle">64 secret held-out flights</text>
    <text x="747" y="342" font-size="13" fill="#475569" text-anchor="middle">Unseen courses test</text>
    <text x="747" y="360" font-size="13" fill="#475569" text-anchor="middle">true generalization</text>

    <line x1="850" y1="290" x2="878" y2="290" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="870" y="96" width="312" height="304" rx="12" fill="#ECFDF5" stroke="#0D9488" stroke-width="2.5"/>
    <rect x="870" y="96" width="312" height="28" rx="10" fill="#0F766E"/>
    <text x="1026" y="115" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">ARGON CHECKS: READ, AUDIT, WATCH, LIVE</text>

    <rect x="880" y="130" width="292" height="122" rx="8" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="890" y="149" font-size="15" font-weight="800" fill="#134E4A">5. CHECK AGENTS' CODE (TWO WAYS)</text>
    <text x="890" y="169" font-size="14" font-weight="700" fill="#0F172A">&#8226; Long-context read: 944,000 tokens</text>
    <text x="902" y="187" font-size="13" fill="#334155">of transcripts in one request</text>
    <text x="890" y="208" font-size="14" font-weight="700" fill="#0F172A">&#8226; Long-output audit: every line of</text>
    <text x="902" y="226" font-size="13" fill="#334155">every controller annotated</text>
    <text x="902" y="243" font-size="13" fill="#334155">in one answer</text>

    <rect x="880" y="258" width="292" height="66" rx="8" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="890" y="278" font-size="15" font-weight="800" fill="#134E4A">6. WATCH FLIGHT VIDEO</text>
    <text x="890" y="297" font-size="14" fill="#1E293B">Argon watches flight video and</text>
    <text x="890" y="315" font-size="14" font-weight="700" fill="#0F766E">calls each flight pass or fail</text>

    <rect x="880" y="330" width="292" height="62" rx="8" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="890" y="350" font-size="15" font-weight="800" fill="#134E4A">7. CHECK LIVE FLIGHT</text>
    <text x="890" y="369" font-size="14" fill="#1E293B">At the table, Argon checks</text>
    <text x="890" y="386" font-size="14" font-weight="700" fill="#0F766E">a live flight</text>
    <rect x="1082" y="352" width="78" height="26" rx="13" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
    <text x="1121" y="370" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">LIVE</text>

    <path d="M 690 392 L 690 407 L 360 407 L 360 420" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 790 392 L 790 420" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 980 400 L 980 420" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="18" y="422" width="490" height="124" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <rect x="18" y="422" width="10" height="124" rx="4" fill="#DC2626"/>
    <text x="40" y="444" font-size="13" font-weight="800" fill="#991B1B">RESULT CALLOUT 1: PRACTICE VS SECRET HELD-OUT FLIGHTS</text>
    <rect x="40" y="454" width="192" height="52" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="52" y="489" font-size="25" font-weight="800" fill="#15803D">16/16</text>
    <text x="136" y="485" font-size="15" font-weight="700" fill="#1E293B">practice</text>
    <line x1="240" y1="480" x2="268" y2="480" stroke="#991B1B" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="276" y="454" width="214" height="52" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <text x="290" y="489" font-size="25" font-weight="800" fill="#DC2626">0/64</text>
    <text x="362" y="485" font-size="15" font-weight="700" fill="#991B1B">held-out</text>
    <text x="40" y="531" font-size="15" font-weight="700" fill="#7F1D1D">The cheater: 16/16 practice, then 0/64 held-out.</text>

    <rect x="528" y="422" width="654" height="124" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <rect x="528" y="422" width="10" height="124" rx="4" fill="#2563EB"/>
    <text x="550" y="444" font-size="13" font-weight="800" fill="#1E40AF">RESULT CALLOUT 2: SEED HUNT IN REBUILDS FROM THE 32-TOKEN RECIPE</text>
    <rect x="550" y="454" width="296" height="52" rx="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="564" y="489" font-size="25" font-weight="800" fill="#DC2626">8 of 8</text>
    <text x="654" y="477" font-size="14" font-weight="700" fill="#1E293B">rebuilds got seed hunt</text>
    <text x="654" y="495" font-size="13" fill="#475569">(cheater's recipe)</text>
    <rect x="862" y="454" width="302" height="52" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="876" y="489" font-size="25" font-weight="800" fill="#059669">0 of 8</text>
    <text x="966" y="477" font-size="14" font-weight="700" fill="#1E293B">rebuilds got seed hunt</text>
    <text x="966" y="495" font-size="13" fill="#475569">(honest recipe)</text>
    <text x="550" y="531" font-size="14" font-weight="700" fill="#1E3A8A">The cheater's recipe passed the seed hunt to 8 of 8 rebuilds; the honest recipe, 0 of 8.</text>
  </g>
</svg>