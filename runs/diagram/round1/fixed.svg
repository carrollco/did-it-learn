<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <rect x="0" y="0" width="1200" height="560" fill="#F8FAFC" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="20" y="38" font-size="26" font-weight="800" fill="#0F172A">Did it learn?</text>
    <text x="210" y="37" font-size="15" font-weight="600" fill="#475569">Pipeline that tells whether an AI build loop learned a task or just learned the test</text>

    <text x="330" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Loop's controller (code) and full transcripts</text>
    <text x="910" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#312E81">All controllers and transcripts</text>
    <path d="M 120 92 L 120 74 L 1046 74 L 1046 89" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 541 92 L 541 74" fill="none" stroke="#334155" stroke-width="2" />
    <path d="M 776 74 L 776 89" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="20" y="92" width="200" height="284" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
    <rect x="20" y="92" width="200" height="28" rx="8" fill="#D97706" />
    <text x="120" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">MANAGED AGENTS</text>

    <rect x="28" y="126" width="184" height="242" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
    <text x="38" y="147" font-size="16" font-weight="800" fill="#92400E">1. BUILD</text>
    <text x="38" y="167" font-size="14" font-weight="700" fill="#1E293B">Google's loop:</text>
    <text x="38" y="184" font-size="13" fill="#334155">render, watch, critique, fix</text>
    <text x="38" y="202" font-size="13" fill="#334155">in Managed Agents sandbox</text>
    <text x="38" y="220" font-size="13" fill="#334155">Quadcopter course:</text>
    <text x="38" y="237" font-size="14" font-weight="700" fill="#B45309">16 practice flights</text>

    <line x1="38" y1="247" x2="202" y2="247" stroke="#FDE68A" stroke-width="1.5" />
    <text x="38" y="263" font-size="13" font-weight="700" fill="#64748B">PRODUCES:</text>

    <rect x="36" y="270" width="168" height="40" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2" />
    <text x="120" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Controller (code)</text>
    <text x="120" y="303" text-anchor="middle" font-size="13" fill="#78350F">flight control program</text>

    <rect x="36" y="316" width="168" height="44" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2" />
    <text x="120" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Record</text>
    <text x="120" y="351" text-anchor="middle" font-size="13" fill="#78350F">(the full transcript)</text>

    <line x1="220" y1="236" x2="241" y2="236" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)" />

    <rect x="244" y="92" width="174" height="284" rx="10" fill="#E0E7FF" stroke="#4338CA" stroke-width="2" />
    <rect x="244" y="92" width="174" height="28" rx="8" fill="#4338CA" />
    <text x="331" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">ARGON</text>

    <rect x="252" y="126" width="158" height="242" rx="8" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" />
    <text x="262" y="147" font-size="16" font-weight="800" fill="#312E81">2. COMPRESS</text>
    <text x="262" y="173" font-size="14" fill="#1E293B">Argon compresses</text>
    <text x="262" y="191" font-size="14" fill="#1E293B">the record</text>
    <text x="262" y="209" font-size="13" fill="#334155">(full transcript)</text>
    <text x="262" y="227" font-size="14" fill="#1E293B">into a compact</text>
    <text x="262" y="245" font-size="14" fill="#1E293B">recipe:</text>

    <rect x="258" y="262" width="146" height="92" rx="6" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.5" />
    <text x="331" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#312E81">32-token recipe</text>
    <text x="331" y="315" text-anchor="middle" font-size="13" fill="#4338CA">distilled from</text>
    <text x="331" y="333" text-anchor="middle" font-size="13" fill="#4338CA">build transcript</text>

    <line x1="418" y1="236" x2="439" y2="236" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)" />

    <rect x="442" y="92" width="198" height="284" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
    <rect x="442" y="92" width="198" height="28" rx="8" fill="#D97706" />
    <text x="541" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">MANAGED AGENTS</text>

    <rect x="450" y="126" width="182" height="242" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
    <text x="460" y="147" font-size="16" font-weight="800" fill="#92400E">3. REBUILD</text>
    <text x="460" y="173" font-size="14" fill="#1E293B">Fresh Managed</text>
    <text x="460" y="191" font-size="14" fill="#1E293B">Agents sandboxes</text>
    <text x="460" y="209" font-size="14" fill="#1E293B">rebuild a controller</text>
    <text x="460" y="227" font-size="14" font-weight="700" fill="#92400E">from recipe alone</text>

    <rect x="458" y="252" width="166" height="102" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
    <text x="541" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">8 to 16 rebuilds</text>
    <text x="541" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#B45309">per recipe</text>
    <text x="541" y="320" text-anchor="middle" font-size="13" fill="#78350F">fresh controllers</text>
    <text x="541" y="338" text-anchor="middle" font-size="13" fill="#78350F">built from recipe only</text>

    <line x1="640" y1="236" x2="661" y2="236" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)" />

    <rect x="664" y="92" width="224" height="284" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2" />
    <rect x="664" y="92" width="224" height="28" rx="8" fill="#059669" />
    <text x="776" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">OUR CODE JUDGE</text>

    <rect x="672" y="126" width="208" height="242" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
    <text x="682" y="147" font-size="16" font-weight="800" fill="#065F46">4. JUDGE</text>
    <text x="682" y="173" font-size="14" font-weight="700" fill="#1E293B">Our code judge flies</text>
    <text x="682" y="191" font-size="14" fill="#1E293B">everything:</text>
    <text x="682" y="211" font-size="13" fill="#334155">• the loop's controller</text>
    <text x="682" y="229" font-size="13" fill="#334155">• and every rebuild</text>

    <rect x="678" y="250" width="196" height="104" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" />
    <text x="776" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">EVALUATED ON:</text>
    <text x="776" y="297" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">64 secret held-out flights</text>
    <text x="776" y="319" text-anchor="middle" font-size="13" fill="#047857">unseen test flights</text>
    <text x="776" y="337" text-anchor="middle" font-size="13" fill="#047857">and flight video logs</text>

    <line x1="888" y1="268" x2="909" y2="268" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)" />

    <rect x="912" y="92" width="268" height="284" rx="10" fill="#E0E7FF" stroke="#4338CA" stroke-width="2" />
    <rect x="912" y="92" width="268" height="28" rx="8" fill="#4338CA" />
    <text x="1046" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">ARGON CHECKS</text>

    <rect x="920" y="126" width="252" height="104" rx="6" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" />
    <text x="930" y="146" font-size="15" font-weight="800" fill="#312E81">5. READ &amp; AUDIT CODE</text>
    <text x="930" y="165" font-size="13" font-weight="700" fill="#1E293B">• Long-context read: 944,000</text>
    <text x="940" y="181" font-size="13" fill="#334155">tokens of transcripts (1 request)</text>
    <text x="930" y="200" font-size="13" font-weight="700" fill="#1E293B">• Long-output audit: every line</text>
    <text x="940" y="216" font-size="13" fill="#334155">of every controller annotated</text>

    <rect x="920" y="236" width="252" height="66" rx="6" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" />
    <text x="930" y="255" font-size="15" font-weight="800" fill="#312E81">6. WATCH FLIGHT VIDEO</text>
    <text x="930" y="274" font-size="13" fill="#1E293B">Argon watches flight video and</text>
    <text x="930" y="291" font-size="13" font-weight="700" fill="#312E81">calls each flight pass or fail</text>

    <rect x="920" y="308" width="252" height="60" rx="6" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" />
    <text x="930" y="327" font-size="15" font-weight="800" fill="#312E81">7. CHECK LIVE FLIGHT</text>
    <text x="930" y="346" font-size="13" fill="#1E293B">At the table, Argon checks a</text>
    <text x="930" y="362" font-size="13" font-weight="700" fill="#312E81">live flight</text>

    <line x1="120" y1="376" x2="120" y2="404" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="541" y1="376" x2="541" y2="390" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="541" y1="390" x2="640" y2="390" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="640" y1="390" x2="640" y2="404" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="4,4" />

    <rect x="20" y="404" width="540" height="136" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" />
    <rect x="20" y="404" width="10" height="136" rx="4" fill="#DC2626" />
    <text x="44" y="428" font-size="13" font-weight="800" fill="#991B1B">RESULT CALLOUT 1: PRACTICE VS. HELD-OUT FLIGHTS</text>

    <rect x="44" y="440" width="210" height="44" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" />
    <text x="60" y="469" font-size="22" font-weight="800" fill="#B91C1C">16/16</text>
    <text x="142" y="467" font-size="15" font-weight="700" fill="#7F1D1D">practice</text>

    <text x="282" y="467" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">then</text>

    <rect x="310" y="440" width="210" height="44" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
    <text x="328" y="469" font-size="22" font-weight="800" fill="#DC2626">0/64</text>
    <text x="398" y="467" font-size="15" font-weight="700" fill="#7F1D1D">held-out</text>

    <text x="44" y="515" font-size="15" font-weight="700" fill="#1E293B">The cheater: 16/16 practice, then 0/64 held-out.</text>

    <rect x="580" y="404" width="600" height="136" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2" />
    <rect x="580" y="404" width="10" height="136" rx="4" fill="#1D4ED8" />
    <text x="604" y="428" font-size="13" font-weight="800" fill="#1E3A8A">RESULT CALLOUT 2: RECIPE REBUILD TEST (SEED HUNT)</text>

    <rect x="604" y="440" width="264" height="44" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" />
    <text x="620" y="469" font-size="22" font-weight="800" fill="#DC2626">8 of 8</text>
    <text x="706" y="467" font-size="15" font-weight="700" fill="#991B1B">cheater rebuilds</text>

    <rect x="884" y="440" width="268" height="44" rx="6" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5" />
    <text x="900" y="469" font-size="22" font-weight="800" fill="#059669">0 of 8</text>
    <text x="986" y="467" font-size="15" font-weight="700" fill="#065F46">honest rebuilds</text>

    <text x="604" y="506" font-size="14" font-weight="700" fill="#1E293B">The cheater's recipe passed the seed hunt to 8 of 8 rebuilds;</text>
    <text x="604" y="525" font-size="14" font-weight="700" fill="#1E293B">the honest recipe, 0 of 8.</text>
  </g>
</svg>